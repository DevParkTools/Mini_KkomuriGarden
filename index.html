<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10231a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>꼬물이 정원</title>
<meta name="description" content="작고 수상한 생명체를 모으고 키우는 3D 정원 게임. 1분이면 레어 꼬물이를 만나요.">
<meta property="og:type" content="website">
<meta property="og:title" content="꼬물이 정원 — 작고 수상한 생명체 키우기">
<meta property="og:description" content="알을 부화하고, 먹이고, 진화시키세요. 1분 안에 레어 꼬물이를 만날 수 있어요.">
<meta property="og:image" content="https://devparktools.github.io/Mini_KkomuriGarden/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<style>
:root{--u:14px;--bg:#10231a;--panel:rgba(18,38,28,.9);--glass:rgba(255,255,255,.16);--text:#f6fff2;--acc:#ffd54a;--ok:#7be0a6;--bad:#ff7d8d;--blue:#7cc4ff;--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;touch-action:none;position:fixed;left:0;top:0}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;font-size:var(--u);line-height:1.25}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}
.hidden{display:none!important}
.btn{pointer-events:auto;min-width:max(48px,3.4em);min-height:max(48px,3.4em);border:0;border-radius:1em;background:var(--glass);color:var(--text);font:inherit;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;gap:.35em;padding:0 .9em;cursor:pointer;touch-action:manipulation;box-shadow:0 .2em 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(.12em);box-shadow:0 .08em 0 rgba(0,0,0,.28)}
.btn.main{background:linear-gradient(#ffe58a,#ffb83d);color:#3a2600}
.btn.tool{flex-direction:column;gap:0;width:max(48px,4.4em);height:max(48px,4.4em);padding:0;font-size:1em}
.btn.tool b{font-size:1.5em;line-height:1}
.btn.tool span{font-size:.68em;font-weight:700;opacity:.92}
.btn.on{outline:.18em solid var(--acc)}
.btn.pulse{animation:pulse 0.9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,213,74,.7)}50%{transform:scale(1.08);box-shadow:0 0 0 .6em rgba(255,213,74,0)}}
.chip{background:var(--panel);border-radius:2em;padding:.3em .85em;min-height:2.3em;display:flex;align-items:center;gap:.4em;font-weight:800;pointer-events:none}
.xp{display:block;width:5em;height:.7em;background:rgba(255,255,255,.2);border-radius:1em;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--acc))}
#topL{position:absolute;left:calc(var(--sal) + .6em);top:calc(var(--sat) + .6em);display:flex;gap:.45em;flex-wrap:wrap;max-width:calc(100% - 9em - var(--sal) - var(--sar))}
#topR{position:absolute;right:calc(var(--sar) + .6em);top:calc(var(--sat) + .6em);display:flex;gap:.45em}
#zoneTabs{position:absolute;left:calc(var(--sal) + .6em);top:calc(var(--sat) + 4em);display:flex;gap:.4em}
#zoneTabs .btn{min-width:max(48px,3em);padding:0 .7em;font-size:.95em}
#zoneTabs .btn.lock{opacity:.6}
#hint{position:absolute;left:50%;top:calc(var(--sat) + 8.4em);transform:translateX(-50%);max-width:min(90%,28em);background:var(--acc);color:#3a2600;border-radius:1.2em;padding:.55em 1.1em;font-weight:900;text-align:center;box-shadow:0 .25em 0 rgba(0,0,0,.3);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-.35em)}}
#toasts{position:absolute;left:50%;top:calc(var(--sat) + 12.6em);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.35em;width:min(92%,26em)}
.toast{background:var(--panel);border-radius:1em;padding:.4em 1em;font-weight:800;text-align:center;animation:toast 2.4s ease forwards}
.toast.good{background:linear-gradient(#3d8f5b,#2c6b44)}
.toast.gold{background:linear-gradient(#ffd54a,#ffae2b);color:#3a2600}
.toast.bad{background:linear-gradient(#b8505e,#8a3340)}
@keyframes toast{0%{opacity:0;transform:translateY(.8em) scale(.9)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-.6em)}}
#bar{position:absolute;right:calc(var(--sar) + .6em);bottom:calc(var(--sab) + .6em);display:flex;flex-direction:column-reverse;flex-wrap:wrap-reverse;align-content:flex-end;gap:.45em;max-height:calc(100% - 13em)}
#joy{position:absolute;left:calc(var(--sal) + 1em);bottom:calc(var(--sab) + 1em);width:9em;height:9em;border-radius:50%;background:rgba(255,255,255,.12);border:.2em solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:4em;height:4em;margin:-2em 0 0 -2em;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 .2em .5em rgba(0,0,0,.3)}
.panel{background:var(--panel);border-radius:1.2em;padding:.7em;pointer-events:auto;box-shadow:0 .3em 1em rgba(0,0,0,.4)}
#cPanel{position:absolute;left:calc(var(--sal) + .6em);bottom:calc(var(--sab) + .6em);width:min(24em,calc(100% - 7em - var(--sal) - var(--sar)));max-height:calc(100% - 12em);overflow:auto;touch-action:pan-y}
.ptop{display:flex;align-items:center;gap:.5em}
.ptop b{font-size:1.15em;flex:1}
.tag{background:var(--glass);border-radius:1em;padding:.1em .6em;font-weight:800;font-size:.85em}
.bar{height:.9em;background:rgba(255,255,255,.18);border-radius:1em;overflow:hidden;margin:.35em 0}
.bar i{display:block;height:100%;width:0}
.bar.mood i{background:linear-gradient(90deg,#ff8a7a,#ffd54a,#7be0a6)}
.bar.love i{background:linear-gradient(90deg,#ff9ac8,#ff5fa0)}
.evo{font-size:.88em;display:grid;grid-template-columns:1fr 1fr;gap:.15em .8em;margin:.3em 0}
.evo span.ok{color:var(--ok)}
.row{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.45em}
.item{position:relative;min-width:max(48px,3.5em);min-height:max(48px,3.5em);flex-direction:column;gap:0;padding:0 .3em;font-size:1em}
.item b{font-size:1.4em;line-height:1}
.item span{font-size:.72em;font-weight:800}
.item em{position:absolute;right:.15em;top:.05em;font-style:normal;font-size:.75em}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.9em;background:rgba(8,20,14,.74);pointer-events:auto;padding:calc(var(--sat) + 1em) calc(var(--sar) + 1em) calc(var(--sab) + 1em) calc(var(--sal) + 1em);text-align:center;touch-action:manipulation}
.logo{font-size:3.2em;font-weight:900;letter-spacing:-.02em;background:linear-gradient(#fff6b0,#ffb83d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .08em 0 rgba(0,0,0,.4));animation:logo 1.6s ease-in-out infinite}
@keyframes logo{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.05) rotate(1deg)}}
.sub{opacity:.9;font-weight:700}
.card{background:var(--panel);border-radius:1.3em;padding:1em;width:min(94%,32em);max-height:calc(100% - 2em);overflow:auto;touch-action:pan-y;overscroll-behavior:contain;text-align:left}
.card h3{margin:.1em 0 .5em;font-size:1.3em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.sumrow{display:flex;justify-content:space-between;padding:.25em 0;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;margin-top:.5em}
.dcell{position:relative;min-height:max(48px,4em);flex-direction:column;gap:.1em;padding:.3em;font-size:.78em;min-width:0}
.dcell i{display:block;width:1.8em;height:1.8em;border-radius:50%}
.dcell.off i{filter:brightness(0);opacity:.5}
#dPanel{position:absolute;left:calc(var(--sal) + .6em);right:calc(var(--sar) + .6em);bottom:calc(var(--sab) + .6em)}
.dscroll{display:flex;gap:.4em;overflow-x:auto;touch-action:pan-x;padding:.3em 0}
#scAd{background:linear-gradient(135deg,#3a1d6e,#c0388a,#ff9d3d);background-size:300% 300%;animation:adbg 4s ease infinite;z-index:5}
@keyframes adbg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.screen#scTitle{background:linear-gradient(180deg,rgba(5,12,11,.62),rgba(5,12,11,.18) 42%,rgba(5,12,11,.88));gap:.7em}
.tEyebrow{letter-spacing:.38em;font-size:.72em;opacity:.8;font-weight:700;color:#f6d98a}
.logo.big{font-size:min(4.4em,14vw);letter-spacing:.1em;padding-left:.1em;background:linear-gradient(#fffbe6,#f6c453 58%,#b9791a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 .4em rgba(255,200,90,.38)) drop-shadow(0 .08em 0 rgba(0,0,0,.5));animation:none}
.tRule{width:min(15em,52%);height:2px;background:linear-gradient(90deg,transparent,#f6c453,transparent)}
.tcol{display:flex;flex-direction:column;align-items:center;gap:.7em;width:100%}
.tVer{position:absolute;bottom:calc(var(--sab) + .6em);font-size:.7em;opacity:.5;letter-spacing:.2em}
#slotList{display:flex;flex-direction:column;gap:.5em;width:min(92vw,30em)}
.slot{display:flex;align-items:stretch;gap:.4em}
.slotMain{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:.15em;text-align:left;min-height:max(56px,4.4em);padding:.55em .9em;border-radius:1em;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--text);font:inherit;cursor:pointer;touch-action:manipulation}
.slotMain b{font-size:1.05em}.slotMain span{font-size:.8em;opacity:.85}
.slot.cur .slotMain{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.slotDel{min-width:max(48px,3.4em);padding:0 .6em}
#steps{position:absolute;left:50%;top:calc(var(--sat) + 8.1em);transform:translateX(-50%);display:flex;gap:.3em;font-size:.72em;font-weight:800;pointer-events:none;white-space:nowrap}
#steps .st{padding:.25em .6em;border-radius:1em;background:rgba(0,0,0,.45);opacity:.65}
#steps .st.done{background:rgba(70,160,100,.75);opacity:1}
#steps .st.now{background:var(--acc);color:#3a2600;opacity:1;animation:pls 1s ease-in-out infinite}
#hint{top:calc(var(--sat) + 10.2em)!important}
#toasts{top:calc(var(--sat) + 14.2em)!important}
#buffs{position:absolute;right:calc(var(--sar) + .6em);top:calc(var(--sat) + 4.4em);display:flex;flex-direction:column;gap:.35em;align-items:flex-end}
#buffs .btn{pointer-events:auto}
.setrow{display:flex;align-items:center;gap:.5em;padding:.2em 0;border-bottom:1px solid rgba(255,255,255,.1);min-height:max(48px,3em)}
.setrow>span{flex:1;font-weight:700}
.setrow input[type=range]{flex:1.3;min-width:0;min-height:max(48px,3em);accent-color:var(--acc)}
.seg{display:flex;gap:.3em;flex-wrap:wrap;justify-content:flex-end}
.seg .btn,.setrow .btn{min-width:max(48px,3em);font-size:.9em;padding:0 .7em}
.btn.danger{background:linear-gradient(#c0505e,#8a3340)}
textarea.sv{width:100%;height:9em;font:inherit;font-size:.8em;border-radius:.6em;border:0;padding:.5em;user-select:text;-webkit-user-select:text;touch-action:pan-y;color:#111}
#capBar{position:absolute;right:calc(var(--sar) + .6em);top:calc(var(--sat) + .6em);display:flex;gap:.4em;opacity:.5;pointer-events:auto}
#capBar:active,#capBar:hover{opacity:1}
#safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:.2em dashed rgba(255,255,255,.85);box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none}
#fps{position:absolute;left:50%;top:calc(var(--sat) + .15em);transform:translateX(-50%);font-size:.75em;font-weight:800;background:rgba(0,0,0,.55);padding:.1em .7em;border-radius:1em;pointer-events:none;white-space:pre;text-align:center;z-index:3}
#dbg{position:absolute;right:calc(var(--sar) + .4em);top:calc(var(--sat) + 5.2em);width:12em;max-height:55%;overflow:auto;background:rgba(0,0,0,.72);border-radius:.8em;padding:.4em;pointer-events:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:.3em;z-index:3}
#dbg .btn{min-height:max(36px,2.4em);font-size:.8em;padding:0 .4em}
.cb{--acc:#f0b400;--ok:#4aa3ff;--bad:#ff7a2f}
.cb .toast.good{background:linear-gradient(#2a6fb8,#1c4f88)}
.cb .toast.bad{background:linear-gradient(#c8541a,#8a3a10)}
.cb .bar.mood i{background:linear-gradient(90deg,#d55e00,#f0e442,#0072b2)}
.cb .bar.love i{background:linear-gradient(90deg,#56b4e9,#cc79a7)}
.cb .bar{position:relative}
.cb .bar::after{content:attr(data-v);position:absolute;right:.4em;top:-.05em;font-size:.8em;font-weight:900;text-shadow:0 0 .3em #000}
.flip #bar{right:auto;left:calc(var(--sal) + .6em)}
.flip #cPanel{left:auto;right:calc(var(--sar) + .6em)}
.onehand #bar{bottom:calc(var(--sab) + 11.5em);flex-direction:row-reverse;flex-wrap:wrap-reverse;max-width:min(24em,70%);max-height:none;justify-content:flex-start;align-content:flex-end}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#0a1a12;opacity:0;pointer-events:none;transition:opacity .22s}
#err{position:fixed;inset:0;z-index:99;background:rgba(40,8,12,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1em;padding:1.5em;text-align:center;font-size:16px}
#err button{font:inherit;font-weight:800;padding:.8em 1.6em;border:0;border-radius:1em;min-height:48px;background:#ffd54a;color:#3a2600}

.btn.tool b{font-size:1.75em}
.btn.tool span{font-size:.62em}
#tHero{width:min(11em,34vw);height:min(11em,34vw);object-fit:contain;filter:drop-shadow(0 .5em .6em rgba(0,0,0,.45));animation:hero 2.2s ease-in-out infinite;pointer-events:auto;cursor:pointer;touch-action:manipulation;margin-bottom:.1em}
#tHero.pop{animation:heropop .35s ease-out}
@keyframes hero{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.5em) rotate(2deg)}}
@keyframes heropop{0%{transform:scale(.7,1.25)}60%{transform:scale(1.18,.86)}100%{transform:scale(1)}}
.tIcons{display:flex;gap:.6em;justify-content:center}
.tIcons .btn.tool{width:max(56px,4.6em);height:max(56px,4.6em)}
.btn.startBig{font-size:1.45em;min-width:8.5em;min-height:2.7em;border-radius:1.6em;gap:.5em}
.btn.startBig b{font-size:1.1em}
.btn.glow{animation:pulse 1.4s ease-in-out infinite}
.slotAv{flex:none;width:2.6em;height:2.6em;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:1.6em}
.slotMain{flex-direction:row!important;align-items:center!important;gap:.7em!important}
.slotBody{display:flex;flex-direction:column;gap:.25em;flex:1;min-width:0}
.chips{display:flex;gap:.35em;flex-wrap:wrap}
.chp{background:rgba(0,0,0,.35);border-radius:1em;padding:.1em .6em;font-size:.82em;font-weight:800;white-space:nowrap}
.qHead{display:flex;justify-content:center;gap:.5em;margin:.2em 0 .5em}
.qDot{width:.7em;height:.7em;border-radius:50%;background:rgba(255,255,255,.25)}
.qDot.on{background:var(--acc)}
.qIco{font-size:3.4em;text-align:center;line-height:1.1;animation:hero 2.2s ease-in-out infinite}
.qQ{text-align:center;font-weight:900;font-size:1.15em;white-space:pre-line;margin:.2em 0 .7em}
.qOpt{flex-direction:column!important;gap:.3em!important;min-height:9em!important;white-space:normal;text-align:center;line-height:1.25;padding:.6em .5em!important}
.qOpt b{font-size:3em;line-height:1}
.qOpt span{font-size:.95em}
.qSpin{font-size:4.2em;text-align:center;animation:qs 1.1s linear infinite}
@keyframes qs{to{transform:rotate(360deg)}}
.qBig{font-size:1.1em;min-height:3.2em;width:100%;margin-top:.6em;gap:.5em}
.shRow{display:flex;gap:.45em;justify-content:center;flex-wrap:nowrap;margin-top:.5em}
.shRow .btn.tool{flex:1;max-width:5.2em;width:auto}
#steps .st{font-size:1.2em;padding:.15em .55em}
@media (max-height:480px){#tHero{width:5em;height:5em;margin-bottom:0}.tVer{display:none}.screen#scTitle{gap:.4em}.btn.startBig{min-height:2.3em}}
</style>
<script>
window.__fatal=function(m){var e=document.getElementById('err');if(!e)return;e.style.display='flex';document.getElementById('errMsg').textContent=String(m).slice(0,300)};
window.addEventListener('error',function(ev){if(ev&&ev.message&&String(ev.message).indexOf('ResizeObserver')>=0)return;window.__fatal((ev&&ev.message)||'error')});
window.addEventListener('unhandledrejection',function(ev){window.__fatal((ev.reason&&ev.reason.message)||ev.reason)});
</script>
</head>
<body>
<div id="app">
<canvas id="gl" tabindex="-1"></canvas>
<div id="ui">
<div id="vig"></div>
<div id="fps" class="hidden"></div>
<div id="safe" class="hidden"></div>
<div id="capBar" class="hidden"><button class="btn tool" id="btnSlow"><b>🐢</b></button><button class="btn tool cam on" id="btnCap0"><b>1</b></button><button class="btn tool cam" id="btnCap1"><b>2</b></button><button class="btn tool cam" id="btnCap2"><b>3</b></button><button class="btn tool" id="btnCapExit"><b>✕</b></button></div>
<div id="hud" class="hidden">
<div id="topL">
<div class="chip"><span>Lv.<b id="lvTxt">1</b></span><span class="xp"><i id="xpFill"></i></span></div>
<div class="chip"><span>🪙</span><b id="goldTxt">0</b></div>
<div class="chip"><span>✨</span><b id="seedTxt">0</b></div>
</div>
<div id="topR"><button class="btn tool" id="btnFs"><b>⛶</b></button><button class="btn tool" id="btnPause"><b>⏸</b></button></div>
<div id="zoneTabs"></div>
<div id="buffs"></div>
<div id="steps" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="toasts"></div>
<div id="bar">
<button class="btn tool main" id="btnShop"><b>🥚</b><span data-t="알 상점|Eggs"></span></button>
<button class="btn tool" id="btnHarvest"><b>💰</b><span data-t="모두 수확|Harvest"></span></button>
<button class="btn tool" id="btnGather"><b>📣</b><span data-t="모여라|Gather"></span></button>
<button class="btn tool" id="btnDeco"><b>🪴</b><span data-t="꾸미기|Decor"></span></button>
<button class="btn tool" id="btnDex"><b>📖</b><span data-t="도감|Dex"></span></button>
<button class="btn tool" id="btnBook"><b>📒</b><span data-t="수첩|Notes"></span></button>
</div>
<div id="cPanel" class="panel hidden">
<div class="ptop"><b id="cName"></b><span class="tag" id="cStage"></span><button class="btn tool" id="cClose"><b>✕</b></button></div>
<button class="btn" id="btnShareC" style="width:100%;min-height:max(48px,3em);margin:.3em 0"><span data-t="📸 자랑하기|📸 Show off"></span></button>
<div class="sub" id="cSay" style="font-size:.85em;margin:.15em 0;min-height:1.2em"></div>
<div class="bar mood"><i id="cMood"></i></div>
<div class="bar love"><i id="cLove"></i></div>
<div class="evo" id="cEvo"></div>
<div class="row" id="cFood"></div>

const isOwlAsleep=(c)=>SP[c.sp].owl?!G.night:G.night;
function enter(c,state,dur){c.state=state;c.stT=dur;c.partner=state==='play'?c.partner:null;c.moving=false;}
function chooseNext(c){
if(isOwlAsleep(c)&&c.st>=0&&Math.random()<CONFIG.ai.sleepChance&&G.tut>=3){enter(c,'sleep',1e9);return;}
if(vis.e&&vis.e.zone===c.zone&&vis.e.state==='stay'&&Math.random()<0.5){c.tx=clamp(vis.e.x+rnd(-1.8,1.8),-lim,lim);c.tz=clamp(vis.e.z+rnd(-1.8,1.8),-lim,lim);enter(c,'walk',rnd(CONFIG.ai.walk[0],CONFIG.ai.walk[1]));return;}
const r=Math.random();
if(r<CONFIG.ai.walkChance){const p=randSpot(c.zone);c.tx=p[0];c.tz=p[1];enter(c,'walk',rnd(CONFIG.ai.walk[0],CONFIG.ai.walk[1]));}
else if(r<CONFIG.ai.walkChance+CONFIG.ai.playChance){enter(c,'play',rnd(CONFIG.ai.play[0],CONFIG.ai.play[1]));c.partner=null;}
else enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));
}
function moveToward(c,tx,tz,sp,h){
const dx=tx-c.x,dz=tz-c.z,d=Math.sqrt(dx*dx+dz*dz);
if(d<0.12){c.moving=false;return true;}
const st=Math.min(d,sp*h);c.x+=dx/d*st;c.z+=dz/d*st;c.yawT=Math.atan2(dx,dz);c.moving=true;c.hopT+=h*CONFIG.ai.hopRate*(sp>2?1.4:1);
return false;
}
const _gw={x:0,z:0};
function creatureStep(c,h){
if(c.state==='evolve'||c.state==='gone')return;
c.stT-=h;c.tapT=Math.max(0,c.tapT-h);
const gd=gardener;
const dgx=gd.x-c.x,dgz=gd.z-c.z,dg2=dgx*dgx+dgz*dgz;
switch(c.state){
case 'idle':c.moving=false;if(c.stT<=0)chooseNext(c);break;
case 'walk':if(moveToward(c,c.tx,c.tz,CONFIG.ai.walkSpeed,h)||c.stT<=0)enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));break;
case 'sleep':c.moving=false;c.heartT-=h;if(c.heartT<=0){c.heartT=2.6;floatText('z',zoneCx(c.zone)+c.x,c.topY*c.sc+1.4,c.z,'#bfd6ff');}if(!isOwlAsleep(c)){enter(c,'cheer',CONFIG.ai.wakeCheer);}break;
case 'eat':c.moving=false;if(c.stT<=0)enter(c,'cheer',CONFIG.ai.cheer);break;
case 'cheer':c.moving=false;c.hopT+=h*CONFIG.ai.hopRate;if(c.stT<=0)enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));break;
case 'play':
c.hopT+=h*CONFIG.ai.hopRate*0.8;c.moving=false;
if(c.partner&&c.partner.state==='play'&&c.partner.partner===c){const p=c.partner;const dx=p.x-c.x,dz=p.z-c.z;const d=Math.sqrt(dx*dx+dz*dz);c.yawT=Math.atan2(dx,dz);if(d>1.1){c.x+=dx/d*1.5*h;c.z+=dz/d*1.5*h;c.moving=true;}}
else if(c.partner){c.partner=null;}
else{c.yawT+=h*3;}
c.heartT-=h;if(c.heartT<=0){c.heartT=CONFIG.ai.heartEvery;burst(zoneCx(c.zone)+c.x,0.2+c.topY*c.sc,c.z,2,0xff8ac0,1.2,2.4);}
if(c.stT<=0){if(c.partner){c.love+=CONFIG.evo.lovePair;checkEvo(c);}c.partner=null;enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));}
break;
case 'follow':
if(dg2>CONFIG.gardener.followR*CONFIG.gardener.followR*2.2||c.stT<=0){enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));break;}
if(dg2>1.4){moveToward(c,gd.x-dgx/Math.sqrt(dg2)*1.0,gd.z-dgz/Math.sqrt(dg2)*1.0,CONFIG.ai.followSpeed,h);}else c.moving=false;
c.compT+=h;if(c.compT>=CONFIG.gardener.loveEvery){c.compT=0;c.love+=CONFIG.evo.loveFollow;checkEvo(c);}
break;
case 'flee':if(moveToward(c,c.tx,c.tz,CONFIG.ai.fleeSpeed,h)||c.stT<=0){c.state='gone';}break;
case 'gather':if(c.stT<=0){enter(c,'idle',1);break;}if(moveToward(c,c.tx,c.tz,CONFIG.gather.speed,h)){c.arr=true;c.hopT+=h*CONFIG.ai.hopRate;c.yawT=Math.atan2(gd.x-c.x,gd.z-c.z);}break;
}
if((c.state==='idle'||c.state==='walk')&&gd.moving&&dg2<CONFIG.gardener.followR*CONFIG.gardener.followR&&Math.random()<CONFIG.gardener.followChance*h){enter(c,'follow',rnd(CONFIG.ai.followDur[0],CONFIG.ai.followDur[1]));}
if(c.state==='walk'){
c.stuckT+=h;
if(c.stuckT>CONFIG.ai.stuckSec){const mx=c.x-c.sx,mz=c.z-c.sz;if(mx*mx+mz*mz<CONFIG.ai.stuckDist*CONFIG.ai.stuckDist){const p=randSpot(c.zone);c.tx=p[0];c.tz=p[1];}c.sx=c.x;c.sz=c.z;c.stuckT=0;}
}
c.reactT-=h;
if(c.reactT<=0){c.reactT=CONFIG.ai.reactEvery;react(c);}
const o=Z[c.zone].obst;
for(let i=0;i<o.length;i++){const dx=c.x-o[i].x,dz=c.z-o[i].z,d2=dx*dx+dz*dz;if(d2<o[i].r*o[i].r&&d2>1e-6){const d=Math.sqrt(d2),k=o[i].r/d;c.x=o[i].x+dx*k;c.z=o[i].z+dz*k;}}
c.x=clamp(c.x,-lim,lim);c.z=clamp(c.z,-lim,lim);
}
function react(c){
if(c.state!=='idle'&&c.state!=='walk')return;
let best=null,bd=CONFIG.ai.pairR*CONFIG.ai.pairR;
for(let i=0;i<crs.length;i++){const o=crs[i];if(o===c||o.zone!==c.zone)continue;if(o.state==='evolve'){const dx=o.x-c.x,dz=o.z-c.z;if(dx*dx+dz*dz<36){enter(c,'cheer',CONFIG.ai.cheer);c.yawT=Math.atan2(dx,dz);return;}continue;}if(o.state!=='idle'&&o.state!=='walk')continue;const dx=o.x-c.x,dz=o.z-c.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=o;}}
if(best){const ch=CONFIG.ai.pairChance+(best.sp===c.sp?CONFIG.ai.sameBonus:0);if(Math.random()<ch){const dur=rnd(CONFIG.ai.play[0],CONFIG.ai.play[1]);enter(c,'play',dur);enter(best,'play',dur);c.partner=best;best.partner=c;S.stat.play++;}}
}
function separate(){
const r=CONFIG.ai.sepR;
for(let i=0;i<crs.length;i++){const a=crs[i];if(a.zone!==G.zone||a.state==='evolve'||a.state==='gone')continue;
for(let j=i+1;j<crs.length;j++){const b=crs[j];if(b.zone!==G.zone||b.state==='evolve'||b.state==='gone')continue;
if(a.partner===b)continue;
const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;if(d2<r*r&&d2>1e-6){const d=Math.sqrt(d2),p=(r-d)*0.25;a.x-=dx/d*p;a.z-=dz/d*p;b.x+=dx/d*p;b.z+=dz/d*p;}}}
}
function gardenerStep(h){
const gd=gardener;let ix=0,iy=0;
if(keys.left)ix-=1;if(keys.right)ix+=1;if(keys.up)iy+=1;if(keys.down)iy-=1;
if(G.joyX!==0||G.joyY!==0){ix=G.joyX;iy=G.joyY;}
const m=Math.sqrt(ix*ix+iy*iy);if(m>1){ix/=m;iy/=m;}
const spd=CONFIG.gardener.speed*ST.sens,tx=(ix-iy)*0.7071*spd,tz=(-ix-iy)*0.7071*spd;
const a=CONFIG.gardener.accel*h;
gd.vx+=clamp(tx-gd.vx,-a,a);gd.vz+=clamp(tz-gd.vz,-a,a);
gd.x=clamp(gd.x+gd.vx*h,-lim,lim);gd.z=clamp(gd.z+gd.vz*h,-lim,lim);
const o=Z[G.zone].obst;for(let i=0;i<o.length;i++){const dx=gd.x-o[i].x,dz=gd.z-o[i].z,d2=dx*dx+dz*dz;if(d2<o[i].r*o[i].r&&d2>1e-6){const d=Math.sqrt(d2),k=o[i].r/d;gd.x=o[i].x+dx*k;gd.z=o[i].z+dz*k;}}
const sp=Math.sqrt(gd.vx*gd.vx+gd.vz*gd.vz);gd.moving=sp>0.5;
if(gd.moving){gd.yaw=Math.atan2(gd.vx,gd.vz);gd.t+=h*10;gd.stepT-=h;if(gd.stepT<=0){gd.stepT=CONFIG.gardener.stepFx;spawnP(zoneCx(G.zone)+gd.x,0.1,gd.z,rnd(-0.4,0.4),1.2,rnd(-0.4,0.4),0.45,0xdff7c8);}}
}

function rollSpecies(zone,type){
const w=CONFIG.egg.weights[type];const own=Math.random()<CONFIG.egg.ownZone;
const pool=[];let tot=0;
for(let i=0;i<SPN;i++){if(own&&SP[i].zone!==zone)continue;pool.push(i);tot+=w[SP[i].rar];}
if(!pool.length)return 0;
let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[SP[pool[i]].rar];if(r<=0)return pool[i];}
return pool[0];
}
const zoneCount=(z)=>{let n=0;for(let i=0;i<crs.length;i++)if(crs[i].zone===z)n++;for(let i=0;i<eggs.length;i++)if(eggs[i].zone===z)n++;return n;};
function eggPrice(type){const n=crs.length+eggs.length;return Math.floor((type===0?CONFIG.econ.eggGold:CONFIG.econ.eggSeeds)*(1+CONFIG.econ.eggGrow*n));}
function buyEgg(type){
if(zoneCount(G.zone)>=CONFIG.zones[G.zone].cap){toast(tr('이 구역은 가득 찼어요. 다른 구역을 이용하세요','Zone is full. Try another one'),'bad');return false;}
const price=eggPrice(type);
if(type===0){if(S.gold<price){toast(tr('골드가 부족해요','Not enough gold'),'bad');return false;}S.gold-=price;}
else{if(S.seeds<price){toast(tr('✨가 부족해요','Not enough ✨'),'bad');return false;}S.seeds-=price;}
const rec={sp:rollSpecies(G.zone,type),zone:G.zone,ready:Date.now()+CONFIG.egg.hatchSec[type]*1000*hatchMul(),big:type};
const p=randSpot(G.zone);spawnEgg(rec,p[0],p[1]);G.hudDirty=true;toast(tr('알을 구매했어요. 쓰다듬으면 더 빨리 부화해요','Egg bought. Petting it speeds up hatching'),'good');return true;
}

function evoNeeds(c){

const canEvo=(c)=>{const n=evoNeeds(c);if(!n.length)return false;for(let i=0;i<n.length;i++)if(!n[i].ok)return false;return true;};
function checkEvo(c){

}
function startEvolve(c){

G.evo={c,t:0,ns,nv,swapped:false};sfx('charge');

function updateEvo(dt){
const E=G.evo;if(!E)return;
const c=E.c;E.t+=dt;const t=E.t,D=CONFIG.fx;
const wx=zoneCx(c.zone)+c.x;
G.zoomT=CONFIG.cam.evoZoom;
c.spin=t<D.evoSwap?t/D.evoSwap:Math.max(0,1-(t-D.evoSwap)/(D.evoDur-D.evoSwap));
c.yaw+=dt*D.evoSpin*c.spin;
if(t<D.evoSwap){if(Math.random()<0.7){const a=Math.random()*TAU,r=1.6*(1-t/D.evoSwap)+0.3;spawnP(wx+Math.cos(a)*r,0.2,c.z+Math.sin(a)*r,0,3+t*2,0,0.7,pick([0xfff0a0,0xffd0f0,0xa0e8ff]));}}
if(t>=D.evoSwap&&!E.swapped){
E.swapped=true;c.st=E.ns;c.va=E.nv;applyForm(c);c.pop=1.6;sfx('evo');vib(80);
burst(wx,1,c.z,70,0xfff0a0,5,5);burst(wx,1,c.z,40,0xff9ad0,4,6);burst(wx,1,c.z,30,0x9adfff,6,4);

}

}

const gath={t:0,on:false,cd:0};
function startGather(){
if(G.state!=='play'||G.evo||deco.on)return;
if(gath.cd>0){toast(tr('재정비 중이에요','Recovering'),'bad');return;}
const list=[];
for(let i=0;i<crs.length;i++){const c=crs[i];if(c.zone===G.zone&&c.state!=='evolve'&&c.state!=='gone'&&c.state!=='flee')list.push(c);}

gath.on=true;gath.t=CONFIG.gather.dur;gath.cd=CONFIG.gather.cooldown;
const GC=CONFIG.gather;
for(let i=0;i<list.length;i++){
const c=list[i],ringI=Math.floor(i/GC.perRing),idx=i%GC.perRing,cnt=Math.min(GC.perRing,list.length-ringI*GC.perRing);

c.tx=clamp(gardener.x+Math.cos(a)*r,-lim,lim);c.tz=clamp(gardener.z+Math.sin(a)*r,-lim,lim);c.arr=false;c.partner=null;enter(c,'gather',GC.dur);
}

floatText(tr('다 모여라!!','Gather!!'),zoneCx(G.zone)+gardener.x,2.8,gardener.z,'#fff2a0');

function updateGather(dt){
gath.cd=Math.max(0,gath.cd-dt);
if(!G.evo)G.zoomT=gath.on?CONFIG.gather.zoom:1;
if(!gath.on)return;
gath.t-=dt;
if(Math.random()<dt*6)spawnP(zoneCx(G.zone)+gardener.x+rnd(-2,2),0.2,gardener.z+rnd(-2,2),0,2.5,0,0.8,pick([0xfff0a0,0xffb0e0,0xa0e8ff]));

gath.on=false;let got=0;
for(let i=0;i<crs.length;i++){const c=crs[i];if(c.zone===G.zone&&c.state==='gather'){c.love+=CONFIG.gather.love;got++;enter(c,'idle',rnd(CONFIG.ai.idle[0],CONFIG.ai.idle[1]));checkEvo(c);}}
const g=got*CONFIG.gather.goldPer;gainGold(g);S.stat.gather++;
toast(tr('단체 쓰다듬기 완료! +🪙'+g,'Group cuddle! +🪙'+g),'gold');sfx('level');checkAch();

const d=ST_DEF[k],v=o[k];

function dmEnsure(){
const k=dkey(new Date());
if(S.dm.k===k&&S.dm.pick.length===3)return;
let h=0;for(let i=0;i<k.length;i++)h=(Math.imul(h,31)+k.charCodeAt(i))>>>0;
const pool=[];for(let i=0;i<MISSIONS.length;i++)pool.push(i);
const pick=[];for(let i=0;i<3;i++){h=(Math.imul(h,1103515245)+12345)>>>0;const j=(h>>>8)%pool.length;pick.push(pool[j]);pool.splice(j,1);}
S.dm.k=k;S.dm.pick=pick;S.dm.cl=[0,0,0];S.dm.bonus=0;S.dm.base={};for(const q in S.stat)S.dm.base[q]=S.stat[q];
}
const dmProg=(m)=>Math.min(m.n,Math.max(0,Math.floor(S.stat[m.k]-(S.dm.base[m.k]||0))));
const dmGold=(m)=>Math.floor(m.g*(1+S.lv*0.15));
function dmClaimable(){dmEnsure();let n=0;for(let i=0;i<3;i++){const m=MISSIONS[S.dm.pick[i]];if(!S.dm.cl[i]&&dmProg(m)>=m.n)n++;}if(!S.dm.bonus&&S.dm.cl[0]&&S.dm.cl[1]&&S.dm.cl[2])n++;return n;}

function slotInfo(i){
let raw=null;try{raw=Store.get(slotKey(i));}catch(e){}
if(!raw)return null;
let o;try{o=JSON.parse(raw);}catch(e){return null;}
if(!o||typeof o!=='object'||o.v!==CONFIG.save.ver)return null;
const s=sanitize(o);
if(s.cr.length===0&&s.eggs.length===0&&s.tut===0)return null;

function wrapLines(x,t,maxW){
const out=[];let line='';
for(const ch of t){
if(ch==='\n'){out.push(line);line='';continue;}
if(x.measureText(line+ch).width>maxW&&line){out.push(line);line=ch===' '?'':ch;}else line+=ch;
}
if(line)out.push(line);

const rows=[[tr('번 골드','Gold earned'),'🪙'+fmt(G.session.gold)],[tr('부화','Hatched'),String(G.session.hatch)],[tr('진화','Evolved'),String(G.session.evo)],[tr('수확 횟수','Harvests'),String(G.session.harvest)],[tr('플레이 시간','Play time'),Math.floor(G.session.t/60)+tr('분 ','m ')+Math.floor(G.session.t%60)+tr('초','s')]];
for(const r of rows){const d=el('div','sumrow',null,rc);el('span','',r[0],d);el('b','',r[1],d);}
const b=el('button','btn main',null,rc);b.style.cssText='width:100%;margin-top:.7em';el('span','',tr('타이틀로','To Title'),b);b.addEventListener('click',()=>{G.session.gold=G.session.hatch=G.session.evo=G.session.harvest=G.session.t=0;showTitle();});
setState('result');
}
$('btnStart').addEventListener('click',()=>{if(audioUnlock)audioUnlock();showSlots(true);});

$('btnResume').addEventListener('click',()=>{setState('play');});

$('btnShop').addEventListener('click',()=>{$('btnShop').classList.remove('pulse');openShop();});
$('btnHarvest').addEventListener('click',()=>{if(G.state==='play')harvestAll();});

$('scIntro').addEventListener('click',()=>{if(G.state==='intro')showTitle();});

document.addEventListener('visibilitychange',()=>{
if(document.hidden){G.hidden=true;G.hiddenAt=Date.now();if(G.state==='play')setState('pause');saveNow();}
else{G.hidden=false;lastTs=performance.now();relWake();if(AUD.ctx)AUD.ctx.resume().catch(()=>{});resumeOffline();}
});
window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeunload',saveNow);

const _c1=new THREE.Color(),_c2=new THREE.Color(),_c3=new THREE.Color();
const SKY_DAY=new THREE.Color(0x9fd8ff),SKY_NIGHT=new THREE.Color(0x0c1230),SKY_DUSK=new THREE.Color(0xff9a6a);
const SUN_DAY=new THREE.Color(0xfff2d0),SUN_NIGHT=new THREE.Color(0x6c86ff);
const HEMI_SKY_D=new THREE.Color(0xcfeaff),HEMI_SKY_N=new THREE.Color(0x4a5ca8);
function updateTime(dt){
G.tod=(G.tod+dt/CONFIG.time.cycleSec)%1;
const h=-Math.cos(G.tod*TAU);
G.dayF=smooth(-0.12,0.3,h);
G.night=h<0;
const dusk=1-Math.abs(h)*4;const dk=clamp(dusk,0,1)*0.8;
_c1.copy(SKY_NIGHT).lerp(SKY_DAY,G.dayF).lerp(SKY_DUSK,dk*0.55);
scene.background.copy(_c1);renderer.setClearColor(_c1);
hemi.intensity=lerp(CONFIG.lights.nightHemi,CONFIG.lights.dayHemi,G.dayF);
hemi.color.copy(HEMI_SKY_N).lerp(HEMI_SKY_D,G.dayF);
sun.intensity=lerp(CONFIG.lights.nightSun,CONFIG.lights.daySun,G.dayF);
sun.color.copy(SUN_NIGHT).lerp(SUN_DAY,G.dayF);
const ang=G.tod*TAU-Math.PI/2;
sun.position.set(Math.cos(ang)*CONFIG.lights.sunDist*0.6+camFx,Math.max(8,Math.sin(ang)*CONFIG.lights.sunDist)+8,CONFIG.lights.sunDist*0.5+camFz);
sun.target.position.set(camFx,0,camFz);
}
let camFx=0,camFz=0;

const hudCache={gold:-1,seeds:-1,lv:-1,xp:-1};
function updateHud(dt){
G.dispGold+=(S.gold-G.dispGold)*Math.min(1,dt*8);if(Math.abs(S.gold-G.dispGold)<1)G.dispGold=S.gold;
const g=Math.floor(G.dispGold);
if(g!==hudCache.gold){hudCache.gold=g;$('goldTxt').textContent=fmt(g);}
if(S.seeds!==hudCache.seeds){hudCache.seeds=S.seeds;$('seedTxt').textContent=fmt(S.seeds);}
if(S.lv!==hudCache.lv){hudCache.lv=S.lv;$('lvTxt').textContent=String(S.lv);}
const xp=Math.floor(S.xp/xpNeed(S.lv)*100);if(xp!==hudCache.xp){hudCache.xp=xp;$('xpFill').style.width=xp+'%';}
if(G.sel)refreshPanel();
}

const fpsAcc={n:0,t:0,low:0,high:0};
function fpsMonitor(dt){
fpsAcc.n++;fpsAcc.t+=dt;
if(fpsAcc.t<CONFIG.render.checkSec)return;
const fps=fpsAcc.n/fpsAcc.t;G.fps=fps;fpsAcc.n=0;fpsAcc.t=0;
if(G.drawCalls>CONFIG.limits.maxCalls)demoteQuality();
const target=ST.fpsCap||60;
if(fps<target*CONFIG.render.lowRatio){fpsAcc.low++;fpsAcc.high=0;if(fpsAcc.low>=CONFIG.render.dropAfter){fpsAcc.low=0;if(V.pr>CONFIG.render.minPR+0.001){V.pr=Math.max(CONFIG.render.minPR,V.pr-CONFIG.render.prStep);resize();}else demoteQuality();}}
else if(fps>=target*CONFIG.render.highRatio){fpsAcc.high++;fpsAcc.low=0;if(fpsAcc.high>=CONFIG.render.raiseAfter){fpsAcc.high=0;if(V.pr<V.prMax-0.001){V.pr=Math.min(V.prMax,V.pr+CONFIG.render.prStep);resize();}}}
else{fpsAcc.low=0;fpsAcc.high=0;}
}

function syncVisuals(dt){
shN=0;
const t=G.gt;
for(let i=0;i<crs.length;i++){
const c=crs[i],p=c.rig;
if(c.zone!==G.zone||c.state==='gone'){p.g.visible=false;continue;}
p.g.visible=true;
c.yaw+=angDiff(c.yaw,c.yawT)*Math.min(1,dt*10)*(c.state==='evolve'?0:1);
let y=0,sq=1;
const hop=c.moving||c.state==='cheer'||c.state==='play'||(c.state==='gather'&&c.arr);
if(hop){const s=Math.sin(c.hopT);y=Math.abs(s)*CONFIG.ai.hopH*c.sc*(c.state==='cheer'?1.6:1);sq=1+(0.5-Math.abs(s))*0.16;}
else if(c.state==='sleep'){sq=0.82+Math.sin(t*1.6+c.id)*0.03;}
else if(c.state==='eat'){sq=1+Math.sin(t*14)*0.07;}
else sq=1+Math.sin(t*2.2+c.id)*0.025;
if(c.state==='evolve'){y=c.spin*0.4;sq=1+Math.sin(t*20)*0.08*c.spin;}
c.pop=Math.max(0,c.pop-dt*3);const pp=1+Math.sin(c.pop*Math.PI)*0.25*Math.min(1,c.pop*2);
c.y=y;
p.g.position.set(zoneCx(c.zone)+c.x,y,c.z);p.g.rotation.y=c.yaw;
const sc=c.sc*pp;p.g.scale.set(sc/Math.sqrt(sq),sc*sq,sc/Math.sqrt(sq));
c.blinkT-=dt;if(c.blinkT<=0){c.blink=0.12;c.blinkT=rnd(2,5);}
c.blink=Math.max(0,c.blink-dt);
const closed=c.state==='sleep'||c.blink>0;
const ey=closed?0.02:(c.st===0?0.115:0.085)*1.2;p.eL.scale.y=ey;p.eR.scale.y=ey;
if(c.st===2){p.acc.rotation.y+=dt*1.5;if(c.va===2){p.acc.position.y=c.topY+0.55+Math.sin(t*3+c.id)*0.08;}}
p.aura.visible=c.st===2&&Q.aura;
const showCoin=c.pend>=CONFIG.econ.coinShowMin&&c.state!=='evolve';
p.bubble.visible=showCoin;
if(showCoin){const bs=0.85+Math.sin(t*5+c.id)*0.08;p.bubble.scale.set(bs/c.sc,bs/c.sc,1);p.bubble.position.y=c.topY+0.9/c.sc*1.0+Math.sin(t*4+c.id)*0.05;}
addShadow(zoneCx(c.zone)+c.x,c.z,0.55*c.sc*(1-Math.min(0.4,y*0.6)));
}
for(let i=0;i<eggs.length;i++){
const e=eggs[i];if(e.zone!==G.zone){e.m.g.visible=false;continue;}e.m.g.visible=true;
e.shake=Math.max(0,e.shake-dt*3);const rem=(e.ready-Date.now())/1000;
const wob=rem<=0?Math.sin(t*10)*0.1:e.shake*Math.sin(t*40)*0.25;
e.m.g.position.set(zoneCx(e.zone)+e.x,rem<=0?Math.abs(Math.sin(t*5))*0.12:0,e.z);e.m.g.rotation.z=wob;
addShadow(zoneCx(e.zone)+e.x,e.z,0.5);
}
const gd=gardener;gd.g.position.set(zoneCx(G.zone)+gd.x,gd.moving?Math.abs(Math.sin(gd.t))*0.12:0,gd.z);gd.g.rotation.y+=angDiff(gd.g.rotation.y,gd.yaw)*Math.min(1,dt*12);
addShadow(zoneCx(G.zone)+gd.x,gd.z,0.5);
shadowMesh.visible=Q.shadow;shadowMesh.count=shN;shadowMesh.instanceMatrix.needsUpdate=true;
}
function updateCamera(dt){
const gd=gardener;let tx=gd.x,tz=gd.z;
const L=half*CONFIG.cam.limitFrac;
if(G.capture){tx=0;tz=0.5;}
else if(G.evo){tx=G.evo.c.x;tz=G.evo.c.z;}
else if(G.sel&&G.sel.zone===G.zone&&G.state==='play'){tx=G.sel.x;tz=G.sel.z;const w=cam.right-cam.left,hh=cam.top-cam.bottom;if(V.w>=V.h*1.15){tx-=0.7071*w*0.17;tz+=0.7071*w*0.17;}else{tx+=0.7071*hh*0.2;tz+=0.7071*hh*0.2;}}
else{tx=clamp(tx,-L,L);tz=clamp(tz,-L,L);}
G.camX=damp(G.camX,tx,CONFIG.cam.follow,dt);G.camZ=damp(G.camZ,tz,CONFIG.cam.follow,dt);
const zt=G.zoomT*(G.evo?1:(G.zoomUser||1))*(G.capture?G.capZoom:1);
G.zoom=damp(G.zoom,zt,CONFIG.cam.zoomDamp,dt);
if(Math.abs(G.zoom-lastZoomApplied)>0.0005)fitCamera();
camFx=zoneCx(G.zone)+G.camX;camFz=G.camZ;
G.shake=Math.max(0,G.shake-dt*CONFIG.fx.shakeDecay);
const shk=G.shake*ST.shake,sx=shk>0?(Math.random()-0.5)*shk*0.6:0,sz=shk>0?(Math.random()-0.5)*shk*0.6:0;
cam.position.set(camFx+camOff.x+sx,camOff.y,camFz+camOff.z+sz);
cam.lookAt(camFx+sx,0,camFz+sz);
}
let flashV=0;
function updateFlash(dt){
if(G.flash){flashV=Math.max(flashV,G.flash);G.flash=0;}
if(flashV>0){flashV=Math.max(0,flashV-dt*2.2);$('flash').style.opacity=String(flashV.toFixed(2));}
}

function update(dt){
G.gt+=dt;
if(G.state==='play'){
G.session.t+=dt;
updateTime(dt);
acc+=dt;let n=0;
while(acc>=CONFIG.render.fixedDt&&n<CONFIG.render.maxSteps){stepFixed(CONFIG.render.fixedDt);acc-=CONFIG.render.fixedDt;n++;}
if(n>=CONFIG.render.maxSteps)acc=0;
econUpdate(dt);updateEvo(dt);updateDelayed(dt);updateGather(dt);updateVisitors(dt);updateFlee(dt);updateDecor(dt);reapGone();
G.hudT+=dt;if(G.hudT>=1/CONFIG.render.hudHz){G.hudT=0;updateHud(0.18);ensureNoNaN();checkAch();fpsHud();updateSteps();}
G.lastSaveT+=dt;if(G.lastSaveT>=CONFIG.save.autoSec){G.lastSaveT=0;saveNow();}
if(hintTimer>0){hintTimer-=dt;if(hintTimer<=0)showHint(null);}
if(G.evo&&G.evo.t>CONFIG.fx.evoDur+5){finishEvolve(G.evo);}
}else if(G.state==='title'||G.state==='intro'){updateTime(dt*0.2);acc=0;for(let i=0;i<crs.length;i++)creatureStep(crs[i],dt);G.zoomT=1;}
updateParticles(dt);updateFloat(dt);updateFlash(dt);updateAmbient(dt);evoFx();
syncVisuals(dt);updateCamera(dt);
}
let acc=0,lastTs=0,introT=0;
function frame(ts){
rafId=requestAnimationFrame(frame);
try{
if(!lastTs)lastTs=ts;
const raw=(ts-lastTs)/1000;
const iv=ST.fpsCap?1000/ST.fpsCap:0;if(iv&&ts-lastTs<iv-2)return;
lastTs=ts;
const dt=Math.min(Math.max(raw,0),CONFIG.render.maxDt);
if(G.state==='intro'){introT+=dt;if(introT>=CONFIG.boot.introSec)showTitle();}
if(G.state==='pause'){if(G.needRender){syncVisuals(0);renderer.render(scene,cam);G.needRender=false;}return;}
if(G.state==='result'){return;}
update(G.capture&&G.slow?dt*CONFIG.capture.slow:dt);fpsMonitor(dt);
renderer.render(scene,cam);G.drawCalls=renderer.info.render.calls;if(dex.open)renderDex();
}catch(e){cancelAnimationFrame(rafId);window.__fatal(e&&e.message?e.message:e);throw e;}
}
let rafId=0;

function boot(){
G.autoLevel=detectLevel();applySettings();applyLang();
document.documentElement.lang=LANG;
buildPanelItems();buildTabs();
resize();
for(let i=0;i<S.cr.length;i++){const r=S.cr[i];const p=randSpot(r.zone);const c=makeCreature(r,p[0],p[1]);}
for(let i=0;i<S.eggs.length;i++){const r=S.eggs[i];const p=randSpot(r.zone);spawnEgg(r,p[0],p[1]);}
restoreDecor();
G.zone=S.zone;Z[G.zone].g.visible=true;
for(let i=0;i<crs.length;i++)crs[i].rig.g.visible=crs[i].zone===G.zone;
for(let i=0;i<eggs.length;i++)eggs[i].m.g.visible=eggs[i].zone===G.zone;
if(S.cr.length>0||S.eggs.length>0){offlineInfo=applyOffline();}
gardener.x=0;gardener.z=2;G.camX=0;G.camZ=2;
buildTabs();hudCache.gold=-1;
updateHud(1);
G.dispGold=S.gold;
let auto=false;try{auto=sessionStorage.getItem('kk_auto')==='1';sessionStorage.removeItem('kk_auto');}catch(e){}
if(auto){setState('title');startPlay();}else setState('intro');
lastTs=0;rafId=requestAnimationFrame(frame);
}
boot();
if(location.search.indexOf('debug=1')>=0)window.__dbg={runQuiz,QTYPES,buildQuizCard,qCaption,tapEgg,foodUse,harvest,giftEvent,tapGiftEgg,openShare,shareCaption,hookStep,updateSteps,GPflag:()=>GP,openBook,fireEvent,BUF,EV,MISSIONS,pickSlot,slotInfo,showSlots,dmEnsure,dmClaimable,SLOT,slotKey,saveSettings,update,simulate,Q,ST,fpsMonitor,applySettings,openSettings,enterCapture,exitCapture,detectLevel,G,S,crs,eggs,AUD,decs,deco,vis,gath,dex,CONFIG,SP,spawnVisitor,claimVisitor,startFlee,startGather,openDex,showRewardAd,checkDaily,addDecor,openDeco,sfx,reapGone,openModal,closeModal,decoTap,gardener,hatch,tapEgg,foodUse,toyUse,harvest,harvestAll,select,cam,V,renderer,startPlay,setState,switchZone,checkEvo,canEvo,addXp,gainGold,toast,openShop,buyEgg,toScreen:(x,z,y)=>{const v=new THREE.Vector3(zoneCx(G.zone)+x,y||0.5,z).project(cam);return [(v.x+1)/2*V.w,(1-v.y)/2*V.h];}};
</script>
